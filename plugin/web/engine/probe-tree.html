<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tree scene probe</title>
    <style>
      html, body { margin: 0; height: 100%; background: #06090f; }
      #stage { position: fixed; inset: 0; }
      #log { position: fixed; left: 8px; top: 8px; color: #8fa; font: 12px monospace; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="log">booting</div>
    <script type="module">
      import { createViewer } from './index.js'
      const log = document.getElementById('log')
      const errors = []
      window.addEventListener('error', (event) => {
        errors.push((event.message || 'error') + ' @' + String(event.filename || '').split('/').pop() + ':' + event.lineno)
        log.textContent = 'ERR ' + errors.join(' || ')
      })
      window.addEventListener('unhandledrejection', (event) => {
        errors.push('rejection: ' + String(event.reason))
        log.textContent = 'ERR ' + errors.join(' || ')
      })
      try {
        const viewer = createViewer(document.getElementById('stage'), {
          theme: { bg: '#070b16', panel: '#0d1526', text: '#e8eefc', dim: '#7f90ae', accent: '#5ee7ff', ok: '#57e39a', warn: '#ffc65c', bad: '#ff6b81' },
        })
        const scene = {
          v: 1,
          kind: 'tree',
          title: 'probe',
          layout: {
            nodes: [
              { id: 0, value: 1, x: 0, y: 1.15, z: 0.16 },
              { id: 1, value: 2, x: 0, y: -0.13, z: -0.56 },
              { id: 2, value: 3, x: -0.9, y: -1.41, z: -1.28 },
            ],
            edges: [[0, 1], [1, 2]],
          },
          frames: [
            { label: 'a', note: 'root', state: { visited: [], frontier: [0], path: [] } },
            { label: 'b', note: 'visit root', state: { visited: [0], frontier: [], path: [0] } },
            { label: 'c', note: 'all', state: { visited: [0, 1, 2], frontier: [], path: [0, 1, 2] } },
          ],
        }
        viewer.setScene(scene)
        viewer.goTo(1)
        const canvas = document.querySelector('#stage canvas')
        setTimeout(() => {
          log.textContent = (errors.length ? 'ERR ' + errors.join(' || ') : 'ok') + ' canvas=' + (canvas ? canvas.width + 'x' + canvas.height : 'none')
        }, 600)
      } catch (error) {
        log.textContent = 'ERROR ' + error.message
      }
    </script>
  </body>
</html>
