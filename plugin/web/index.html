<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeetCode Lab</title>
    <link rel="manifest" href="/leetcode-lab/manifest.webmanifest" />
    <meta name="theme-color" content="#101426" />
    <link rel="icon" type="image/png" href="/leetcode-lab/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #101426;
      }
      body[data-lc-theme='light'] {
        background: #efe9db;
      }
      #root {
        height: 100%;
      }
    </style>
    <script>
      // No-flash theme: resolve before the app mounts (mirrors store.js logic).
      try {
        var s = JSON.parse(localStorage.getItem('leetcodeLab.settings.v1') || '{}');
        var want = s && s.theme ? s.theme : 'system';
        var dark = want === 'dark' || (want !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.body.dataset.lcTheme = dark ? 'dark' : 'light';
      } catch (e) {
        /* defaults stand */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from '/leetcode-lab/app.js'
      mount(document.getElementById('root'))
    </script>
  </body>
</html>
